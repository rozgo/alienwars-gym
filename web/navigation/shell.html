<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AlienWars · Navigation policy</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#15191b;color:#e6e9e5;font:14px system-ui}header{display:flex;align-items:center;gap:24px;padding:12px 22px;border-bottom:1px solid #3a4143}header a{color:#71dfd0}#identity{font:12px monospace;color:#a1adae;overflow-wrap:anywhere}canvas{display:block;width:100%;height:calc(100vh - 64px);outline:0;touch-action:none}#status{position:absolute;top:100px;left:24px;padding:20px;background:#1d2729;border:1px solid #71dfd0;max-width:650px}button{background:#27393a;color:#dbe5df;border:1px solid #637b7d;border-radius:5px;padding:6px 12px}
</style></head><body><header><strong>ALIENWARS / NAVIGATION</strong><a href="/">Training stats</a><button id="fullscreen">Fullscreen</button><span id="identity">Loading provenance…</span></header>
<div id="status" role="status">Preparing the shared world and policy…</div><canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<script>
const canvas=document.querySelector('canvas'),statusBox=document.querySelector('#status');
var Module={canvas,arguments:[],print:console.log,printErr:console.error,
 onRuntimeInitialized(){statusBox.textContent='Generating terrain and navigation cache…';},
 onAbort(error){statusBox.hidden=false;statusBox.textContent='Viewer stopped: '+error;},
 setStatus(text){if(text)statusBox.textContent=text;},
 postRun(){statusBox.hidden=true;}};
function installMapInput(){
 let pointer=null,lastX=0,lastY=0;
 const clear=()=>{if(pointer!==null&&canvas.hasPointerCapture(pointer))canvas.releasePointerCapture(pointer);pointer=null;};
 canvas.addEventListener('pointerdown',e=>{if(e.button!==0||e.offsetX>canvas.clientWidth-330)return;canvas.focus();pointer=e.pointerId;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(pointer);});
 canvas.addEventListener('pointermove',e=>{if(e.pointerId!==pointer)return;Module._aw_nav_orbit?.(e.clientX-lastX,e.clientY-lastY);lastX=e.clientX;lastY=e.clientY;});
 canvas.addEventListener('pointerup',clear);canvas.addEventListener('pointercancel',clear);canvas.addEventListener('lostpointercapture',()=>pointer=null);
 window.addEventListener('blur',clear);document.addEventListener('visibilitychange',()=>{if(document.hidden)clear();});
 canvas.addEventListener('wheel',e=>{e.preventDefault();e.stopImmediatePropagation();const unit=e.deltaMode===1?16:e.deltaMode===2?canvas.clientHeight:1;Module._aw_nav_zoom?.(e.deltaY*unit*.0012);},{passive:false,capture:true});
}
document.querySelector('#fullscreen').onclick=()=>canvas.requestFullscreen();
fetch('manifest.json').then(r=>{if(!r.ok)throw Error('Missing manifest');return r.json();}).then(manifest=>{
 const query=new URLSearchParams(location.search);
 const integer=(key,fallback,min,max)=>{const value=query.has(key)?Number(query.get(key)):fallback;if(!Number.isInteger(value)||value<min||value>max)throw Error('Invalid '+key);return value;};
 const mode=integer('controller',manifest.checkpoint?0:4,0,4);
 if(mode===0&&!manifest.checkpoint)throw Error('This build has no checkpoint. Choose controller=4 for manual or 1–3 for a disclosed baseline.');
 Module.arguments=[`--env.controller=${mode}`,`--env.map_seed=${integer('seed',10001,0,4294967295)}`,'--env.maps=1',`--env.episode_seed=${integer('episode_seed',9001,0,4294967295)}`,`--env.task_kind=${integer('kind',-1,-1,2)}`,`--policy.hidden_size=${manifest.hidden}`,`--policy.num_layers=${manifest.layers}`];
 if(mode===0)Module.arguments.unshift('policy.bin');
 document.querySelector('#identity').textContent=mode===0?`${manifest.checkpoint} · SHA-256 ${manifest.checkpoint_sha256}`:['','Random baseline','Greedy baseline','Privileged graph reference','Manual control'][mode];
 installMapInput();const script=document.createElement('script');script.src='index.js';document.body.appendChild(script);
 // main stays alive under Asyncify; postRun is therefore not a ready event.
 const ready=setInterval(()=>{if(Module._aw_nav_zoom&&canvas.width>300&&Module.calledRun){statusBox.hidden=true;clearInterval(ready);}},500);
}).catch(error=>{statusBox.textContent=error.message;});
</script>
<!-- The runtime is loaded after its manifest, rather than the shell placeholder. -->
<template>{{{ SCRIPT }}}</template></body></html>
